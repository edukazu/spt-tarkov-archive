name: Monitorar versões de mods
on:
  push:
    branches: [main]
    paths:
      - 'data/mods/installed-spt-4.1.6.json'
      - 'scripts/check_mod_updates.py'
      - '.github/workflows/check-mods.yml'
  schedule:
    - cron: '39 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_mod_updates.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
